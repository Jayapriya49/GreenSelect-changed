services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: renewai-postgis
    restart: always
    environment:
      POSTGRES_DB: renewai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: renewai_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d renewai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: renewai-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:renewai_secure_password@postgres:5432/renewai
      - NASA_POWER_BASE_URL=https://power.larc.nasa.gov/api/temporal/climatology/point
    ports:
      - "8000:8000"
    command: >
      sh -c "python scripts/seed_database.py &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: renewai-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
